        /* RED GRID */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

                linear-gradient(rgba(255, 40, 20, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 40, 20, 0.15) 1px, transparent 1px);
            background-size: 45px 45px;
            pointer-events: none;
            animation: driftGrid 14s linear infinite;
            z-index: 0;
        }

        @keyframes driftGrid {
            0% { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(45px) translateX(45px); }
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

                rgba(255, 30, 0, 0.1) 0px,

        .timer-progress {

        .timer-progress-bar {

            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        function formatTimeRemaining(ms) {
            if (ms <= 0) return 'EXPIRED';
            const days = Math.floor(ms / (1000*60*60*24));
            const hours = Math.floor((ms % (86400000)) / 3600000);
            const minutes = Math.floor((ms % 3600000) / 60000);
            if (days > 0) return `${days}d ${hours}h ${minutes}m`;
            if (hours > 0) return `${hours}h ${minutes}m`;

            timerDisplay.innerHTML = formatTimeRemaining(remaining);
            const totalDuration = 30 * 24 * 60 * 60 * 1000;
            let percent = Math.max(0, (remaining / totalDuration) * 100);
            timerProgress.style.width = percent + '%';
            if (remaining < 3 * 24 * 3600000) timerProgress.style.background = '#ff3300';

        // ============ NAL REMOVAL BYPASS (JavaScript port of v.py) ============
        // Removes SEI (type 6) and AUD (type 9) NAL units from H.264 samples
        const REMOVE_NAL_TYPES = new Set([6, 9]);

        function readUint32(data, offset) { return new DataView(data, offset, 4).getUint32(0, false); }
        function writeUint32(data, offset, value) { new DataView(data, offset, 4).setUint32(0, value, false); }
        function readUint64(data, offset) { return new DataView(data, offset, 8).getBigUint64(0, false); }
        
        function parseBoxes(data, start, end) {
            if (end === undefined) end = data.byteLength;
            let boxes = [];
            let p = start;
            while (p + 8 <= end) {
                let size = readUint32(data, p);
                let type = new TextDecoder().decode(data.slice(p+4, p+8));
                let header = 8;
                if (size === 1) {
                    size = Number(readUint64(data, p+8));
                    header = 16;
                } else if (size === 0) size = end - p;
                if (size < header || p + size > end) break;
                let box = { type, start: p, header, end: p+size, children: [] };
                let childStart = p + header;
                if (type === 'meta') childStart += 4;
                else if (type === 'avc1') childStart = p + header + 78;
                else if (type === 'mp4a') childStart = p + header + 28;
                const containerSet = new Set(['moov','trak','mdia','minf','stbl','edts','udta','meta','ilst','dinf','avc1','mp4a']);
                if (containerSet.has(type) && childStart < p+size) {
                    box.children = parseBoxes(data, childStart, p+size);
                }
                boxes.push(box);
                p += size;
            }
            return boxes;
        }

        function findPath(boxes, types) {
            let cur = boxes;
            for (let t of types) {
                let next = [];
                for (let b of cur) {
                    for (let child of b.children) if (child.type === t) next.push(child);
                }
                cur = next;
            }
            return cur;
        }

                    let boxes = parseBoxes(buffer);

                    let mdat = boxes.find(b => b.type === 'mdat');

                    // Find video track

                            let handler = new TextDecoder().decode(buffer.slice(off, off+4));

                        }
                    }
                    if (!videoTrak) return reject('No video track found');

                    let stszBox = findPath([videoTrak], ['mdia','minf','stbl','stsz'])[0];
                    let stscBox = findPath([videoTrak], ['mdia','minf','stbl','stsc'])[0];
                    let stcoBoxes = findPath([videoTrak], ['mdia','minf','stbl','stco']);
                    let co64Boxes = findPath([videoTrak], ['mdia','minf','stbl','co64']);
                    let chunkBox = stcoBoxes[0] || co64Boxes[0];
                    if (!chunkBox) return reject('No chunk offset box');

                    // Parse stsz
                    let stszStart = stszBox.start + stszBox.header;
                    let sampleSize = readUint32(buffer, stszStart+4);
                    let sampleCount = readUint32(buffer, stszStart+8);
                    let sizes = [];
                    let tablePos = stszStart + 12;
                    if (sampleSize !== 0) {
                        for (let i=0; i<sampleCount; i++) sizes.push(sampleSize);
                    } else {

                    // Parse chunk offsets

                    } else {
                        for (let i=0; i<chunkCount; i++) chunkOffsets.push(Number(readUint64(buffer, chunkTable + i*8)));
                    }

                    // Parse stsc

                    let stscCount = readUint32(buffer, stscStart+4);
                    let stscEntries = [];
                    let stscTable = stscStart + 8;

                    // Build sample offsets

                            sampleOffsets.push(offset);
                            offset += sizes[idx];

                    let totalDelta = 0;
                    let totalRemoved = 0;

                    for (let i=0; i<Math.min(sampleOffsets.length, sizes.length); i++) {
                        let off = sampleOffsets[i];
                        let sz = sizes[i];
                        let sample = new Uint8Array(buffer, off, sz);
                        let out = [];
                        let p = 0;
                        while (p + 4 <= sample.length) {
                            let nalSize = readUint32(sample.buffer, sample.byteOffset + p);
                            if (nalSize === 0) {
                                out.push(0,0,0,0);
                                p += 4;
                                continue;
                            }
                            let nalStart = p + 4;
                            if (nalStart + nalSize > sample.length) break;
                            let nalType = sample[nalStart] & 0x1F;
                            if (REMOVE_NAL_TYPES.has(nalType)) {
                                totalRemoved++;
                                p += 4 + nalSize;
                                continue;
                            }
                            // keep this NAL
                            out.push((nalSize >> 24) & 0xFF, (nalSize >> 16) & 0xFF, (nalSize >> 8) & 0xFF, nalSize & 0xFF);
                            for (let j=0; j<nalSize; j++) out.push(sample[nalStart + j]);
                            p += 4 + nalSize;
                        }
                        if (p < sample.length) {
                            // leftover bytes, keep as is
                            for (let j=p; j<sample.length; j++) out.push(sample[j]);
                        }
                        let newSample = new Uint8Array(out);
                        let delta = sz - newSample.length;
                        if (delta !== 0) {
                            videoMap.set(off, { oldSize: sz, sample: newSample });
                            sizes[i] = newSample.length;
                            events.push({ pos: off + sz, delta: delta });
                            totalDelta += delta;
                        }
                    }

                    if (totalDelta === 0) return reject('No NAL units removed (video already clean?)');

                    // Update stsz table
                    let stszView = new Uint8Array(buffer);
                    for (let i=0; i<sizes.length; i++) {
                        writeUint32(stszView.buffer, tablePos + i*4, sizes[i]);
                    }

                    // Sort events and apply delta shift to chunk offsets
                    events.sort((a,b) => a.pos - b.pos);
                    function shiftBefore(pos) {
                        let s = 0;
                        for (let ev of events) {
                            if (ev.pos <= pos) s += ev.delta;
                            else break;
                        }
                        return s;
                    }

                    function updateOffsets(box) {
                        if (box.type === 'stco') {
                            let start = box.start + box.header;
                            let cnt = readUint32(buffer, start+4);
                            let table = start + 8;
                            for (let i=0; i<cnt; i++) {
                                let oldOff = readUint32(buffer, table + i*4);
                                let newOff = oldOff - shiftBefore(oldOff);
                                writeUint32(stszView.buffer, table + i*4, newOff);
                            }
                        } else if (box.type === 'co64') {
                            let start = box.start + box.header;
                            let cnt = readUint32(buffer, start+4);
                            let table = start + 8;
                            for (let i=0; i<cnt; i++) {
                                let oldOff = Number(readUint64(buffer, table + i*8));
                                let newOff = oldOff - shiftBefore(oldOff);
                                let newOffBig = BigInt(newOff);
                                let dv = new DataView(stszView.buffer, table + i*8, 8);
                                dv.setBigUint64(0, newOffBig, false);
                            }
                        }
                    }
                    let moovBoxes = [moov];
                    (function recurse(boxes) {
                        for (let b of boxes) {
                            updateOffsets(b);
                            recurse(b.children);
                        }
                    })(moovBoxes);

                    // Rebuild output buffer
                    let payloadStart = mdat.start + mdat.header;
                    let payloadEnd = mdat.end;
                    let outChunks = [];
                    outChunks.push(new Uint8Array(buffer, 0, payloadStart));
                    let p = payloadStart;
                    let sortedKeys = Array.from(videoMap.keys()).sort((a,b)=>a-b);
                    for (let off of sortedKeys) {
                        let entry = videoMap.get(off);
                        if (off > p) outChunks.push(new Uint8Array(buffer, p, off - p));
                        outChunks.push(entry.sample);
                        p = off + entry.oldSize;
                    }
                    if (p < payloadEnd) outChunks.push(new Uint8Array(buffer, p, payloadEnd - p));
                    // rest after mdat
                    outChunks.push(new Uint8Array(buffer, payloadEnd));

                    let finalBuffer = new Blob(outChunks).arrayBuffer();
                    let finalU8 = new Uint8Array(finalBuffer);
                    // update mdat size
                    let newMdatSize = (payloadEnd - payloadStart) - totalDelta;
                    if (mdat.header === 8) {
                        writeUint32(finalU8.buffer, mdat.start, newMdatSize);
                    } else {
                        // 16-byte header (size=1)
                        let dv = new DataView(finalU8.buffer, mdat.start+8, 8);
                        dv.setBigUint64(0, BigInt(newMdatSize), false);
                    }

                    let patchedBlob = new Blob([finalU8], { type: 'video/mp4' });
                    let outName = file.name.replace(/\.[^/.]+$/, '') + '_EABVFX_NAL.mp4';
                    resolve({ success: true, blob: patchedBlob, filename: outName, removed: totalRemoved });
                };
                reader.onerror = () => reject('File read error');
                reader.readAsArrayBuffer(file);
            });
        }

        // ============ UI BINDINGS ============
        const filePicker = document.getElementById('filePicker');
        const videoInput = document.getElementById('videoInput');
        const bypassBtn = document.getElementById('bypassBtn');
        const fileInfoDiv = document.getElementById('fileInfo');
        let selectedFile = null;

        filePicker.addEventListener('click', () => videoInput.click());
        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            selectedFile = file;
            document.getElementById('fileName').textContent = file.name.length > 35 ? file.name.slice(0,32)+'...' : file.name;
            document.getElementById('fileSize').textContent = (file.size / (1024*1024)).toFixed(2) + ' MB';
            fileInfoDiv.style.display = 'block';
            // get resolution
            const vid = document.createElement('video');
            vid.preload = 'metadata';
            vid.onloadedmetadata = () => {
                URL.revokeObjectURL(vid.src);
                document.getElementById('fileResolution').textContent = `${vid.videoWidth}x${vid.videoHeight}`;
                bypassBtn.disabled = false;
            };
            vid.src = URL.createObjectURL(file);
            resetInactivityTimer();
        });

        bypassBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            resetInactivityTimer();
            bypassBtn.disabled = true;
            const originalText = bypassBtn.innerHTML;
            bypassBtn.innerHTML = '<span class="spinner"></span> REMOVING NAL UNITS...';
            try {
                const result = await bypassWithNALRemoval(selectedFile);
                if (result.success) {
                    const successDiv = document.createElement('div');
                    successDiv.className = 'success-animation';
                    successDiv.innerHTML = `<svg viewBox="0 0 24 24" style="width:50px; fill:#2ecc71;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><div style="font-weight:800;">SUCCESS!</div><div style="font-size:11px">Removed ${result.removed} NAL units</div>`;
                    document.body.appendChild(successDiv);
                    const url = URL.createObjectURL(result.blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = result.filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    setTimeout(() => { successDiv.remove(); }, 2000);
                } else throw new Error(result.error);
            } catch (err) {
                alert('Bypass failed: ' + err.message);
            } finally {
                bypassBtn.innerHTML = originalText;
                bypassBtn.disabled = false;
            }
        });

        // Login / Logout
        const verifyBtnUI = document.getElementById('verifyBtn');
        const loginScreen = document.getElementById('loginScreen');
        const mainApp = document.getElementById('mainApp');
        const logoutBtn = document.getElementById('logoutBtn');

        verifyBtnUI.addEventListener('click', async () => {
            const license = document.getElementById('licenseKey').value.trim();
            const errorDiv = document.getElementById('loginError');
            if (!license) { errorDiv.innerHTML = '❌ Enter license key'; return; }
            errorDiv.innerHTML = 'Verifying...';
            const result = await verifyLicense(license);
            if (result.success) {
                errorDiv.innerHTML = '';
                loginScreen.style.display = 'none';
                mainApp.classList.remove('hidden');
                startSubscriptionTimer(result.expiry);
                resetInactivityTimer();
                setInterval(checkSubscriptionStatus, 30*60*1000);
                window.addEventListener('focus', checkSubscriptionStatus);
            } else {
                errorDiv.innerHTML = '❌ ' + (result.error || 'Invalid license');
            }
        });

        logoutBtn.addEventListener('click', () => logout());

        (async () => {
            const session = await checkExistingSession();
            if (session.valid) {
                loginScreen.style.display = 'none';
                mainApp.classList.remove('hidden');
                startSubscriptionTimer(session.expiry);
                resetInactivityTimer();
                await checkSubscriptionStatus();
                setInterval(checkSubscriptionStatus, 30*60*1000);
            }
        })();

        // Particles (red theme)
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth, height = window.innerHeight;
        let particles = [];
        function resizeCanvas() { canvas.width = width; canvas.height = height; }
        window.addEventListener('resize', () => { width = window.innerWidth; height = window.innerHeight; resizeCanvas(); });
        resizeCanvas();
        for (let i=0; i<120; i++) {
            particles.push({
                x: Math.random() * width, y: Math.random() * height,
                size: 2 + Math.random() * 5,
                vx: (Math.random() - 0.5) * 0.7, vy: 0.3 + Math.random() * 1.2,
                alpha: 0.4 + Math.random() * 0.5
            });
        }
        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for (let p of particles) {
                p.x += p.vx; p.y += p.vy;
                if (p.x < -20) p.x = width+20;
                if (p.x > width+20) p.x = -20;
                if (p.y > height+30) { p.y = -20; p.x = Math.random() * width; }
                if (p.y < -20) p.y = height+30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 70, 50, ${p.alpha})`;
                ctx.shadowBlur = 10; ctx.shadowColor = '#ff3300';
                ctx.fill();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Theme toggle (double tap header)
        let tapCount = 0;
        document.querySelector('.card')?.addEventListener('click', () => {
            tapCount++;
            setTimeout(() => { tapCount = 0; }, 500);
            if (tapCount === 2) {
                document.body.classList.toggle('light-mode');
                tapCount = 0;
            }
            resetInactivityTimer();
        });
    </script>
</body>
</html>
