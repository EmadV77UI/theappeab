name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List all files (debug)
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== EABVFX_iOS directory ==="
          ls -la EABVFX_iOS/
          echo "=== EABVFX.xcodeproj contents ==="
          ls -la EABVFX_iOS/EABVFX.xcodeproj/
          echo "=== xcschemes folder ==="
          ls -la EABVFX_iOS/EABVFX.xcodeproj/xcshareddata/xcschemes/ || echo "No scheme folder found"

      - name: Build iOS app
        id: build
        continue-on-error: true
        run: |
          cd EABVFX_iOS
          xcodebuild -project EABVFX.xcodeproj \
            -scheme EABVFX \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee xcodebuild.log

      - name: Show Build Log on Failure
        if: steps.build.outcome != 'success'
        run: |
          echo "=== Xcode Build Log ==="
          cd EABVFX_iOS
          cat xcodebuild.log

      - name: Check if build succeeded
        if: steps.build.outcome == 'success'
        run: |
          cd EABVFX_iOS
          if [ -d "build/Release-iphoneos/EABVFX.app" ]; then
            echo "Build successful! App found."
            mkdir -p Payload
            cp -r build/Release-iphoneos/EABVFX.app Payload/
            zip -r EABVFX.ipa Payload/
          else
            echo "Build claimed success but no .app file found"
            echo "Looking for any .app files..."
            find . -name "*.app" -type d
            exit 1
          fi

      - name: Upload IPA
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: EABVFX.ipa
          path: EABVFX_iOS/EABVFX.ipa
