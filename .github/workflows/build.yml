name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List all files (debug)
        run: |
          ls -la
          ls -la EABVFX_iOS/

      - name: Build iOS app
        run: |
          cd EABVFX_iOS
          xcodebuild -project EABVFX.xcodeproj \
            -scheme EABVFX \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log

      - name: Show build log (if failed)
        if: failure()
        run: |
          cd EABVFX_iOS
          cat build.log

      - name: Check if .app was created
        run: |
          cd EABVFX_iOS
          find . -name "*.app" -type d

      - name: Create IPA
        if: success()
        run: |
          cd EABVFX_iOS
          mkdir -p Payload
          cp -r build/Release-iphoneos/EABVFX.app Payload/
          zip -r EABVFX.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EABVFX.ipa
          path: EABVFX_iOS/EABVFX.ipa
