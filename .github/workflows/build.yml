name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show folder structure
        run: |
          echo "=== Full folder structure ==="
          ls -la
          echo "=== Inside EABVFX_iOS ==="
          ls -la EABVFX_iOS/ || echo "EABVFX_iOS folder not found!"

      - name: Build with xcodebuild
        run: |
          cd EABVFX_iOS
          xcodebuild -project EABVFX.xcodeproj -list
          xcodebuild -project EABVFX.xcodeproj \
            -scheme EABVFX \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath ./DerivedData \
            build

      - name: Find and copy .app
        run: |
          cd EABVFX_iOS
          echo "Searching for .app files..."
          find . -name "*.app" -type d
          APP_PATH=$(find ./DerivedData -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r EABVFX.ipa Payload/
            echo "IPA created successfully!"
            ls -la EABVFX.ipa
          else
            echo "No .app file found. Build failed."
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EABVFX.ipa
          path: EABVFX_iOS/EABVFX.ipa
